# Solaar reaches Logitech receivers and devices through hidapi, which on
# FreeBSD is built against libusb and so opens the USB device node
# /dev/ugenX.Y -- not /dev/hidraw*.  Those nodes are created root:operator
# with mode 0600, so only the mode has to be relaxed, and only for Logitech
# hardware: every other USB device on the system keeps its default 0600.
#
# Add the users who should be allowed to configure their devices to the
# "operator" group:
#
#	pw groupmod operator -m yourusername

# Plugging the device in, and enumeration at boot.
notify 100 {
	match "system"		"USB";
	match "subsystem"	"DEVICE";
	match "type"		"ATTACH";
	match "vendor"		"(0x046d|0x17ef)";
	action "chmod 660 /dev/$cdev";
};

# The HID interfaces are also re-attached without the device being
# re-enumerated -- resuming from suspend, or a hub power cycle -- which
# leaves the node in place but does not raise the notify above.
attach 100 {
	device-name "usbhid[0-9]+";
	match "vendor"		"(0x046d|0x17ef)";
	action "chmod 660 /dev/$ugen";
};

# The KeyPress, MouseClick and MouseScroll rule actions simulate input
# through /dev/uinput, which uinput(4) creates as root:wheel.
notify 100 {
	match "system"		"DEVFS";
	match "subsystem"	"CDEV";
	match "type"		"CREATE";
	match "cdev"		"uinput";
	action "chgrp operator /dev/uinput && chmod 660 /dev/uinput";
};
